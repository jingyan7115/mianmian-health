    function lab(){const rows=[...(state.labReports||[])].sort((a,b)=>b.recordedAt.localeCompare(a.recordedAt));const body=`<div class="entry-list">${rows.map(r=>`<article class="entry" id="item-lab-${esc(r.id)}"><div class="entry-top"><div><h3>${esc(r.title)}</h3><small>${esc((r.panels||[]).join(" · "))}</small></div><span class="date">${date(r.recordedAt)}</span></div><p>${esc(r.summary||"")}</p>${(r.results||[]).length?`<table class="result-table"><thead><tr><th>项目</th><th>结果</th><th>单位</th><th>状态</th></tr></thead><tbody>${r.results.map(x=>`<tr><td>${esc(x.label||x.metric)}</td><td>${esc(x.value)}</td><td>${esc(x.unit||"")}</td><td>${esc(x.status||"")}</td></tr>`).join("")}</tbody></table>`:""}<div class="entry-actions">${(r.reportPages||[]).map((p,i)=>`<button class="report-button" data-view-report="${esc(r.id)}" data-page="${i}">▧ ${esc(p.label||`报告第 ${i+1} 页`)}</button>`).join("")}</div></article>`).join("")}</div>`;return moduleShell("lab",body)}
    function renal(){const body=`<div class="stats">${["CREA","SDMA","PHOS","BUN"].map(stat).join("")}</div><div style="height:13px"></div><div class="chart-card"><div class="metric-tabs">${["CREA","SDMA","PHOS","BUN","USG","UPC","SBP"].map(m=>`<button class="${selectedMetric===m?"active":""}" data-renal-metric="${m}">${esc(METRIC_LABEL[m]||m)}</button>`).join("")}</div>${chart(selectedMetric)}</div><div style="height:13px"></div><div class="notice"><h3>${esc(state.renalNotice?.title||"待完成监测")}</h3><p>${esc(state.renalNotice?.detail||"建议结合尿检、UPC 与血压评估，不只依据单次肌酐判断。")}</p></div>`;return moduleShell("renal",body)}
    function entryCard(e){const data=Object.entries(e.data||{}).filter(([,v])=>v!==""&&v!=null);return `<article class="entry" id="item-module-${esc(e.id)}"><div class="entry-top"><div><h3>${esc(e.title)}</h3><small>${esc(MODULE_LABEL[e.module]||e.module)}</small></div><span class="date">${date(e.recordedAt)}</span></div><p>${esc(e.summary||"已录入结构化记录。")}</p>${data.length?`<div class="kv">${data.map(([k,v])=>`<div><small>${esc((FIELDS[e.module]||[]).find(f=>f[0]===k)?.[1]||k)}</small><strong>${esc(v)}</strong></div>`).join("")}</div>`:""}<div class="entry-actions">${(e.imageUrls||[]).map((u,i)=>`<button data-entry-image="${esc(e.id)}" data-page="${i}">▧ 查看报告 ${i+1}</button>`).join("")}<button data-edit="${esc(e.id)}">✎ 修改</button><button class="danger" data-delete="${esc(e.id)}">删除</button></div></article>`}
    function editableModule(id){const rows=[...(state.moduleEntries||[])].filter(x=>x.module===id).sort((a,b)=>b.recordedAt.localeCompare(a.recordedAt));return moduleShell(id,rows.length?`<div class="entry-list">${rows.map(entryCard).join("")}</div>`:`<div class="empty">暂无记录，可以点击右上角新增。</div>`,true)}
    function timelineEvents(){const all=[...(state.timeline||[]).map(x=>({date:x.date,type:x.type,title:x.title,detail:x.detail})),...(state.labReports||[]).map(x=>({date:x.recordedAt,type:"实验室",title:x.title,detail:x.summary})),...(state.moduleEntries||[]).map(x=>({date:x.recordedAt,type:MODULE_LABEL[x.module]||x.module,title:x.title,detail:x.summary}))];const seen=new Set();return all.filter(x=>{const k=`${x.date}|${x.title}`;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>b.date.localeCompare(a.date))}
    function timeline(){const body=`<div class="entry-list">${timelineEvents().map((e,i)=>`<article class="entry" id="item-time-${i}"><div class="entry-top"><div><h3>${esc(e.title)}</h3><small>${esc(e.type)}</small></div><span class="date">${date(e.date)}</span></div><p>${esc(e.detail||"")}</p></article>`).join("")}</div>`;return moduleShell("timeline",body)}
    function allSearch(query){const q=query.trim().toLowerCase(),includes=(...x)=>x.join(" ").toLowerCase().includes(q);if(!q)return[];const out=[];(state.labReports||[]).forEach(x=>{if(includes(x.recordedAt,x.title,x.summary,(x.panels||[]).join(" "),JSON.stringify(x.results)))out.push({type:"lab",id:x.id,title:x.title,meta:`实验室 · ${date(x.recordedAt)}`,detail:x.summary})});(state.moduleEntries||[]).forEach(x=>{if(includes(x.recordedAt,x.title,x.summary,MODULE_LABEL[x.module],JSON.stringify(x.data)))out.push({type:x.module,id:x.id,title:x.title,meta:`${MODULE_LABEL[x.module]} · ${date(x.recordedAt)}`,detail:x.summary})});(state.metrics||[]).forEach(x=>{if(includes(x.recordedAt,x.metric,METRIC_LABEL[x.metric],x.value,x.status,x.source))out.push({type:"renal",id:null,title:`${METRIC_LABEL[x.metric]||x.metric} ${x.value} ${x.unit}`,meta:`指标 · ${date(x.recordedAt)}`,detail:x.status})});return out.slice(0,80)}
    function searchResults(q){const rows=allSearch(q);return `<div class="view"><div class="toolbar"><button class="back" data-nav="home">← 返回首页</button></div><div class="module-title"><h1>“${esc(q)}”的检索结果</h1><p>找到 ${rows.length} 条相关记录</p></div><div style="height:14px"></div>${rows.length?`<div class="search-results">${rows.map(x=>`<button class="search-result" data-search-type="${esc(x.type)}" data-search-id="${esc(x.id??"")}"><small>${x.meta}</small><strong>${esc(x.title)}</strong><p>${esc(x.detail||"")}</p></button>`).join("")}</div>`:`<div class="empty">没有找到对应内容，请尝试日期、检查名称、药物或指标缩写。</div>`}</div>`}
    async function openDb(){return new Promise((res,rej)=>{const req=indexedDB.open("mianmian-portable-files",1);req.onupgradeneeded=()=>req.result.createObjectStore("files",{keyPath:"id"});req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
    async function putFile(file,id=crypto.randomUUID()){const db=await openDb();await new Promise((res,rej)=>{const tx=db.transaction("files","readwrite");tx.objectStore("files").put({id,name:file.name,type:file.type,blob:file,createdAt:new Date().toISOString()});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close();return id}
    async function getFile(id){const db=await openDb();const item=await new Promise((res,rej)=>{const req=db.transaction("files").objectStore("files").get(id);req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)});db.close();return item}
    async function allFiles(){const db=await openDb();const items=await new Promise((res,rej)=>{const req=db.transaction("files").objectStore("files").getAll();req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)});db.close();return items}
    async function clearFiles(){const db=await openDb();await new Promise((res,rej)=>{const tx=db.transaction("files","readwrite");tx.objectStore("files").clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}
    async function resolveAsset(url){if(REPORTS[url])return REPORTS[url];if(url?.startsWith("local:")){const item=await getFile(url.slice(6));return item?URL.createObjectURL(item.blob):""}return url||""}
    async function showViewer(urls,index=0,title="检查报告"){let current=Math.max(0,Math.min(index,urls.length-1));overlay.innerHTML=`<div class="modal"><section class="viewer-card"><header class="modal-head viewer-head"><h2>${esc(title)}</h2><button class="close" data-close>×</button></header><div class="viewer-body" id="viewer-body"></div>${urls.length>1?`<div class="viewer-nav"><button data-prev>上一页</button><button data-next>下一页</button></div>`:""}</section></div>`;async function draw(){const src=await resolveAsset(urls[current]);const file=urls[current]?.startsWith("local:")?await getFile(urls[current].slice(6)):null;document.querySelector("#viewer-body").innerHTML=file?.type==="application/pdf"?`<iframe src="${src}"></iframe>`:`<img src="${src}" alt="${esc(title)} 第 ${current+1} 页">`}await draw();overlay.querySelector("[data-close]").onclick=()=>overlay.innerHTML="";overlay.querySelector("[data-prev]")?.addEventListener("click",()=>{current=(current-1+urls.length)%urls.length;draw()});overlay.querySelector("[data-next]")?.addEventListener("click",()=>{current=(current+1)%urls.length;draw()})}
    function editor(module,id=null){const entry=id!=null?(state.moduleEntries||[]).find(x=>String(x.id)===String(id)):null;const defs=FIELDS[module]||[];overlay.innerHTML=`<div class="modal"><section class="modal-card"><header class="modal-head"><h2>${entry?"修改":"新增"}${esc(MODULE_LABEL[module])}</h2><button class="close" data-close>×</button></header><form class="modal-body" id="editor-form"><div class="form-grid"><div class="field"><label>记录日期</label><input name="recordedAt" type="date" required value="${esc(entry?.recordedAt||today())}"></div><div class="field"><label>记录名称</label><input name="title" required value="${esc(entry?.title||"")}"></div><div class="field wide"><label>摘要</label><textarea name="summary">${esc(entry?.summary||"")}</textarea></div>${defs.map(([key,label,type="text"])=>`<div class="field ${type==="textarea"?"wide":""}"><label>${esc(label)}</label>${type==="textarea"?`<textarea name="d_${key}">${esc(entry?.data?.[key]??"")}</textarea>`:type==="select"?`<select name="d_${key}"><option value="">请选择</option>${["好日","一般","坏日"].map(v=>`<option ${entry?.data?.[key]===v?"selected":""}>${v}</option>`).join("")}</select>`:`<input name="d_${key}" type="${type}" ${type==="number"&&module==="qol"?'min="0" max="5" step="1"':type==="number"?'step="0.1"':''} value="${esc(entry?.data?.[key]??"")}">`}</div>`).join("")}${module==="imaging"?`<div class="field wide"><label>增加报告图片或 PDF（存储在本机）</label><input name="files" type="file" accept="image/*,application/pdf" multiple></div>`:""}</div><div class="modal-foot"><button type="button" class="secondary" data-close>取消</button><button class="primary">保存并更新</button></div></form></section></div>`;overlay.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>overlay.innerHTML="");overlay.querySelector("#editor-form").onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(ev.currentTarget),data={};defs.forEach(([key,,type])=>{const value=String(fd.get(`d_${key}`)||"").trim();if(value!=="")data[key]=type==="number"?Number(value):value});let imageUrls=[...(entry?.imageUrls||[])];for(const file of (fd.getAll("files")||[])){if(file instanceof File&&file.size){const fid=await putFile(file);imageUrls.push(`local:${fid}`)}}const next={id:entry?.id??-Date.now(),module,recordedAt:String(fd.get("recordedAt")),title:String(fd.get("title")).trim(),summary:String(fd.get("summary")).trim(),data,imageUrls,sourceKey:entry?.sourceKey||`local:${crypto.randomUUID()}`,createdAt:entry?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};if(entry)state.moduleEntries=state.moduleEntries.map(x=>String(x.id)===String(entry.id)?next:x);else state.moduleEntries=[next,...(state.moduleEntries||[])];persist();overlay.innerHTML="";route={name:"module",id:module};render();toast(entry?"记录已更新":"新记录已添加")}}
    function uploadModal(){overlay.innerHTML=`<div class="modal"><section class="modal-card"><header class="modal-head"><h2>上传检查结果</h2><button class="close" data-close>×</button></header><form class="modal-body" id="upload-form"><div class="privacy">免账号版本不会把新扫描件上传到服务器；文件和录入数值只保存在当前设备。为保证医学准确性，请逐项核对后再保存。</div><div style="height:14px"></div><div class="form-grid"><div class="field wide"><label>扫描件图片或 PDF</label><input type="file" name="file" accept="image/*,application/pdf" required></div><div class="field"><label>检查日期</label><input type="date" name="recordedAt" value="${today()}" required></div><div class="field"><label>记录名称</label><input name="title" value="扫描检查报告" required></div><div class="field wide"><label>指标（每行：代码, 数值, 单位, 状态）</label><textarea name="metrics" placeholder="CREA, 151, µmol/L, 本次报告范围内&#10;SDMA, 9, µg/dL, 报告范围内"></textarea></div></div><div class="modal-foot"><button type="button" class="secondary" data-close>取消</button><button class="primary">保存到本机健康库</button></div></form></section></div>`;overlay.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>overlay.innerHTML="");overlay.querySelector("#upload-form").onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(ev.currentTarget),file=fd.get("file");if(!(file instanceof File)||!file.size)return;const fid=await putFile(file),recordedAt=String(fd.get("recordedAt")),title=String(fd.get("title")),lines=String(fd.get("metrics")||"").split(/\n+/).map(x=>x.split(",").map(v=>v.trim())).filter(x=>x[0]&&Number.isFinite(Number(x[1])));const maxId=Math.max(0,...(state.metrics||[]).map(x=>Number(x.id)||0));const metrics=lines.map((x,i)=>({id:maxId+i+1,recordedAt,metric:x[0].toUpperCase(),value:Number(x[1]),unit:x[2]||"",status:x[3]||"已由用户核对",source:file.name,sourceUploadId:`local:${fid}`}));state.metrics=[...(state.metrics||[]),...metrics];state.records=[{id:-Date.now(),recordedAt,category:"检查报告",title,summary:metrics.map(x=>`${x.metric} ${x.value} ${x.unit}`).join("；"),sourceUploadId:`local:${fid}`},...(state.records||[])];persist();overlay.innerHTML="";render();toast("扫描件和已核对指标已保存")}}
    function more(){return `<div class="view"><div class="module-title"><h1>更多与备份</h1><p>免账号版本的数据只属于当前设备</p></div><div style="height:14px"></div><div class="privacy"><strong>请定期导出备份。</strong> 清理浏览器数据、更换手机或使用无痕模式可能删除本机记录。备份文件包含你新增的健康记录和扫描件，请妥善保管。</div><div style="height:14px"></div><div class="backup-grid"><article class="backup-card"><h3>导出完整备份</h3><p>导出当前数据及本机上传的扫描件，可在另一台设备导入。</p><button class="primary" data-export>导出备份文件</button></article><article class="backup-card"><h3>导入备份</h3><p>选择此前导出的 JSON 文件，恢复记录和扫描件。</p><label class="secondary" style="display:inline-block">选择备份文件<input class="hidden" type="file" accept="application/json" data-import></label></article><article class="backup-card"><h3>添加到手机桌面</h3><p>在浏览器分享菜单中选择“添加到主屏幕”，即可像 App 一样打开。</p></article><article class="backup-card"><h3>恢复初始数据</h3><p>删除本机新增内容并回到首次发布版本。此操作不可撤销。</p><button class="secondary danger" data-reset>恢复初始版本</button></article></div></div>`}
    const dataUrl=blob=>new Promise((res,rej)=>{const r=new FileReader;r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)});
    async function exportBackup(){const files=await allFiles(),payload={version:2,exportedAt:new Date().toISOString(),state,files:await Promise.all(files.map(async x=>({id:x.id,name:x.name,type:x.type,createdAt:x.createdAt,data:await dataUrl(x.blob)})))};const blob=new Blob([JSON.stringify(payload)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`面面健康工作台备份_${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("备份文件已生成")}
    function dataUrlToBlob(url){const [head,body]=url.split(","),type=head.match(/data:(.*?);/)?.[1]||"application/octet-stream",bin=atob(body),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type})}
    async function importBackup(file){const payload=JSON.parse(await file.text());if(!payload?.state)throw new Error("不是有效的面面健康工作台备份");state=payload.state;await clearFiles();for(const x of payload.files||[]){const blob=dataUrlToBlob(x.data),f=new File([blob],x.name,{type:x.type});await putFile(f,x.id)}persist();route={name:"home"};render();toast("备份已恢复")}
    function render(){document.querySelectorAll("[data-nav]").forEach(b=>b.classList.toggle("active",b.dataset.nav===route.name));if(route.name==="home")main.innerHTML=home();else if(route.name==="library")main.innerHTML=library();else if(route.name==="trends")main.innerHTML=trends();else if(route.name==="more")main.innerHTML=more();else if(route.name==="search")main.innerHTML=searchResults(route.id);else if(route.name==="module"){if(route.id==="lab")main.innerHTML=lab();else if(route.id==="renal")main.innerHTML=renal();else if(route.id==="timeline")main.innerHTML=timeline();else main.innerHTML=editableModule(route.id)}bind();if(route.highlight){setTimeout(()=>{const el=document.querySelector(route.highlight);el?.classList.add("highlight");el?.scrollIntoView({behavior:"smooth",block:"center"});route.highlight=null},80)}window.scrollTo({top:0,behavior:"instant"})}
    function bind(){document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{route={name:b.dataset.nav,id:null};render()});document.querySelectorAll("[data-category]").forEach(b=>b.onclick=()=>{route={name:"module",id:b.dataset.category};if(route.id==="renal"&&!['CREA','SDMA','PHOS','BUN','USG','UPC','SBP'].includes(selectedMetric))selectedMetric="CREA";render()});document.querySelector("#search-form")?.addEventListener("submit",ev=>{ev.preventDefault();const q=document.querySelector("#search-input").value.trim();if(q){route={name:"search",id:q};render()}});document.querySelectorAll("[data-metric]").forEach(b=>b.onclick=()=>{selectedMetric=b.dataset.metric;render()});document.querySelectorAll("[data-renal-metric]").forEach(b=>b.onclick=()=>{selectedMetric=b.dataset.renalMetric;render()});document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>editor(b.dataset.add));document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const e=state.moduleEntries.find(x=>String(x.id)===b.dataset.edit);if(e)editor(e.module,e.id)});document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{const e=state.moduleEntries.find(x=>String(x.id)===b.dataset.delete);if(e&&confirm(`确定删除“${e.title}”吗？`)){state.moduleEntries=state.moduleEntries.filter(x=>String(x.id)!==String(e.id));persist();render();toast("记录已删除")}});document.querySelectorAll("[data-view-report]").forEach(b=>b.onclick=()=>{const r=state.labReports.find(x=>String(x.id)===b.dataset.viewReport);if(r)showViewer((r.reportPages||[]).map(p=>p.imageUrl),Number(b.dataset.page),`${r.recordedAt} · ${r.title}`)});document.querySelectorAll("[data-entry-image]").forEach(b=>b.onclick=()=>{const e=state.moduleEntries.find(x=>String(x.id)===b.dataset.entryImage);if(e)showViewer(e.imageUrls||[],Number(b.dataset.page),`${e.recordedAt} · ${e.title}`)});document.querySelectorAll("[data-search-type]").forEach(b=>b.onclick=()=>{const type=b.dataset.searchType,id=b.dataset.searchId;route={name:"module",id:type,highlight:id?type==="lab"?`#item-lab-${CSS.escape(id)}`:`#item-module-${CSS.escape(id)}`:null};render()});document.querySelectorAll("[data-action=upload]").forEach(b=>b.onclick=uploadModal);document.querySelector("[data-export]")?.addEventListener("click",exportBackup);document.querySelector("[data-import]")?.addEventListener("change",async ev=>{try{if(ev.target.files?.[0])await importBackup(ev.target.files[0])}catch(e){toast(e.message||"导入失败")}});document.querySelector("[data-reset]")?.addEventListener("click",async()=>{if(confirm("确定删除这台设备上的新增记录并恢复初始版本吗？")){state=clone(INITIAL);persist();await clearFiles();route={name:"home"};render();toast("已恢复初始版本")}})}
    document.querySelectorAll(".bottom-nav [data-nav]").forEach(b=>b.onclick=()=>{route={name:b.dataset.nav,id:null};render()});
    render();
  })();
  </script>
